[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-hippocampus"
version = "0.1.0"
description = "An external episodic-memory prototype for video observations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.25",
    "lap>=0.5.12",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pydantic>=2.10,<3",
    "ultralytics>=8.3",
]

[project.scripts]
digital-hippocampus = "digital_hippocampus.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digital_hippocampus = ["static/*"]
